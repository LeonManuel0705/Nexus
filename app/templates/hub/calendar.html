{% extends "hub/base.html" %}

{% block title %}Nexus - Calendar{% endblock %}

{% block content %}
<section class="widget glass-card widget-full">
    <div class="widget-header">
        <div>
            <h2 class="widget-title" data-i18n="calendar">Calendar</h2>
            <p class="widget-subtitle" data-i18n="calendar_subtitle">Your schedule at a glance</p>
        </div>
        <div class="calendar-controls">
            <select id="calendarAccountSelect" class="account-select" title="Select Google Account">
                <option value="">Loading...</option>
            </select>
            <div class="calendar-nav">
                <button id="prevMonth" title="Previous month">&lt;</button>
                <span id="calendarMonth">Month Year</span>
                <button id="nextMonth" title="Next month">&gt;</button>
            </div>
        </div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="calendar-events" id="calendarEvents">
        <div class="events-header">
            <h3 data-i18n="upcoming_events">Upcoming Events</h3>
            <button class="add-btn small" id="addEventBtn" title="Add event">+</button>
        </div>
        <div class="events-list" id="eventsList"></div>
    </div>
</section>
{% endblock %}

{% block modals %}
<!-- Event Modal -->
<div class="modal" id="eventModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="eventModalTitle" data-i18n="add_event">Add Event</h3>
            <button class="modal-close" id="eventModalClose">&times;</button>
        </div>
        <form id="eventForm">
            <div class="form-group">
                <label for="eventTitle" data-i18n="event_title">Title</label>
                <input type="text" id="eventTitle" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="eventDate" data-i18n="date">Date</label>
                    <input type="date" id="eventDate" required>
                </div>
                <div class="form-group">
                    <label for="eventTime" data-i18n="time">Time</label>
                    <input type="time" id="eventTime">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="eventEndDate" data-i18n="end_date">End Date</label>
                    <input type="date" id="eventEndDate">
                </div>
                <div class="form-group">
                    <label for="eventEndTime" data-i18n="end_time">End Time</label>
                    <input type="time" id="eventEndTime">
                </div>
            </div>
            <div class="form-group">
                <label for="eventLocation" data-i18n="location">Location</label>
                <input type="text" id="eventLocation" placeholder="Add location">
            </div>
            <div class="form-group">
                <label for="eventCalendar" data-i18n="calendar_select">Calendar</label>
                <select id="eventCalendar">
                    <option value="primary">Primary Calendar</option>
                </select>
            </div>
            <div class="form-group">
                <label for="eventDescription" data-i18n="description">Description</label>
                <textarea id="eventDescription" rows="3"></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn-secondary btn-danger" id="deleteEvent" style="display: none;" data-i18n="delete">Delete</button>
                <button type="submit" class="btn-primary" data-i18n="save">Save</button>
            </div>
            <div id="eventError" class="form-error" style="display: none;"></div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        HubApp.initCalendar();
        HubApp.initEventListeners();
    });
</script>
{% endblock %}
