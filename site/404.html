<!doctype html>
<html lang="en">
  <head>
    <script>
    (function() {
      var errorQueue = [];
      var pirschReady = false;
      var maxErrors = 5;
      var errorCount = 0;

      function reportToPirsch(errorData) {
        if (errorCount >= maxErrors) return;
        errorCount++;

        var location = errorData.filename || '';
        if (errorData.lineno) {
          location += ':' + errorData.lineno;
          if (errorData.colno) {
            location += ':' + errorData.colno;
          }
        }

        var stack = errorData.stack || '';
        if (stack.length > 1500) {
          stack = stack.substring(0, 1500) + '... (truncated)';
        }

        try {
          pirsch('Runtime Error', {
            meta: {
              type: errorData.type || 'error',
              message: (errorData.message || 'Unknown error').substring(0, 500),
              location: location.substring(0, 500),
              stack: stack,
              url: window.location.href.substring(0, 500)
            },
            non_interactive: true
          });
        } catch (e) {
          console.error('[Runtime Error]', errorData.message);
        }
      }

      function flushQueue() {
        while (errorQueue.length > 0) {
          reportToPirsch(errorQueue.shift());
        }
      }

      function handleError(errorData) {
        if (typeof pirsch === 'function') {
          pirschReady = true;
          reportToPirsch(errorData);
        } else {
          errorQueue.push(errorData);
        }
      }

      window.addEventListener('error', function(event) {
        handleError({
          type: 'error',
          message: event.message || (event.error && event.error.message) || 'Unknown error',
          stack: event.error && event.error.stack,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno
        });
      });

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        handleError({
          type: 'unhandledrejection',
          message: (reason && reason.message) || String(reason) || 'Unhandled Promise Rejection',
          stack: reason && reason.stack
        });
      });

      var checkCount = 0;
      var checkInterval = setInterval(function() {
        checkCount++;
        if (typeof pirsch === 'function') {
          pirschReady = true;
          flushQueue();
          clearInterval(checkInterval);
        } else if (checkCount >= 20) {
          clearInterval(checkInterval);
        }
      }, 500);

      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          if (typeof pirsch === 'function') {
            pirschReady = true;
            flushQueue();
          }
        }, 500);
      });
    })();
  </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Inclusive Sans', system-ui, sans-serif;
        color: #1A202C;
        background: linear-gradient(to bottom, #F3F0FF, #FFFFFF 50%, #FDF2F8);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        overflow: hidden;
      }

      h1, h2, h3 { font-family: 'Radio Canada Big', sans-serif; }

      .wrapper {
        max-width: 520px;
        width: 100%;
        text-align: center;
      }

      /* Floating dots */
      .dots { position: relative; margin-bottom: 2rem; }

      .dot {
        position: absolute;
        border-radius: 50%;
        animation: bounce 2s ease-in-out infinite;
      }

      .dot-1 {
        width: 12px; height: 12px;
        background: #B794F4;
        top: -16px; left: 25%;
        animation-duration: 2s;
      }

      .dot-2 {
        width: 8px; height: 8px;
        background: #F093FB;
        top: 32px; right: 25%;
        animation-delay: 0.5s;
        animation-duration: 2.5s;
      }

      .dot-3 {
        width: 16px; height: 16px;
        background: #A3BFFA;
        top: -8px; right: 33%;
        animation-delay: 1s;
        animation-duration: 3s;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }

      /* 404 number */
      .code-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .code {
        font-family: 'Radio Canada Big', sans-serif;
        font-size: clamp(8rem, 25vw, 12rem);
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(to bottom right, #667EEA, #764BA2, #F093FB);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        user-select: none;
      }

      /* The zero character wraps the compass */
      .zero-wrap {
        position: relative;
        display: inline-block;
      }

      /* Spinning compass — sized to fit inside the 0 counter */
      .compass {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .compass svg {
        width: 43%;
        height: auto;
        color: rgba(118, 75, 162, 0.25);
        animation: spin 8s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Text */
      .message {
        margin-top: 2rem;
        margin-bottom: 2.5rem;
      }

      .message h2 {
        font-size: clamp(1.4rem, 4vw, 1.75rem);
        font-weight: 600;
        color: #334155;
        margin-bottom: 1rem;
        text-wrap: balance;
      }

      .message p {
        font-size: 1.05rem;
        color: #64748B;
        line-height: 1.7;
        max-width: 420px;
        margin: 0 auto;
        text-wrap: pretty;
      }

      .message .hint {
        font-size: 0.875rem;
        color: #94A3B8;
        margin-top: 0.75rem;
      }

      /* Buttons */
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.75rem;
        font-family: 'Radio Canada Big', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s;
      }

      .btn svg { width: 20px; height: 20px; }

      .btn-primary {
        background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 14px rgba(102, 126, 234, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }

      .btn-secondary {
        background: transparent;
        color: #475569;
        border: 1.5px solid #E2E8F0;
      }

      .btn-secondary:hover {
        border-color: #764BA2;
        color: #764BA2;
        background: rgba(118, 75, 162, 0.04);
      }

      /* Footer link */
      .footer {
        margin-top: 3rem;
        font-size: 0.85rem;
        color: #94A3B8;
      }

      .footer a {
        color: #764BA2;
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 0.2s;
      }

      .footer a:hover { color: #667EEA; }

      @media (max-width: 480px) {
        .actions { flex-direction: column; align-items: center; }
        .btn { width: 100%; max-width: 260px; justify-content: center; }
      }
    </style>
  </head>

              <circle cx="12" cy="12" r="10" />
