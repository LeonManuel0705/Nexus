name: nexus
description: "A new Flutter project."

publish_to: 'none'

version: 0.3.0+17

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  provider: ^6.1.1

  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  connectivity_plus: ^5.0.2
  http: ^1.2.0
  flutter_inappwebview: ^6.0.0

  enough_mail: ^2.1.6

  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0

  workmanager: ^0.6.0
  flutter_local_notifications: ^17.0.0

  permission_handler: ^11.3.0

  intl: ^0.19.0
  uuid: ^4.2.1
  url_launcher: ^6.2.1
  html: ^0.15.4
  crypto: ^3.0.3

  cupertino_icons: ^1.0.8

  hive: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/nexus-logo.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/nexus-logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/nexus-logo.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

